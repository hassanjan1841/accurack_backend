name: Deploy to AWS ECR and EC2

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.build.outputs.IMAGE_URI }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build and Push to ECR
        id: build
        run: |
          # Make script executable
          chmod +x ./scripts/deploy-to-ecr.sh

          # Run the deployment script
          ./scripts/deploy-to-ecr.sh

          # Capture IMAGE_URI for next job
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/accurack-backend:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "✅ Image pushed: $IMAGE_URI"
        env:
          AWS_REGION: us-east-1
          ECR_REPOSITORY: accurack-backend
          IMAGE_TAG: latest
          DOCKERFILE: Dockerfile

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_USER_STAGING }}
          key: ${{ secrets.EC2_SSH_KEY_STAGING }}
          port: 22
          script: |
            echo "🚀 Starting deployment on EC2..."

            # Navigate to project directory (adjust path as needed)
            cd /home/ubuntu/accurack

            # Configure AWS credentials for ECR login
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_DEFAULT_REGION=us-east-1

            # Login to ECR
            echo "🔐 Logging into ECR..."
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            # Set IMAGE_URI environment variable
            export IMAGE_URI="${{ needs.build-and-push.outputs.image-uri }}"
            echo "📦 Using image: $IMAGE_URI"

            # Run database migrations before starting containers
            echo "🔄 Running database migrations..."
            set -e
            docker run --rm \
              -e DATABASE_URL="${{ secrets.DATABASE_URL_STAGING }}" \
              -e DB_HOST="${{ secrets.DB_HOST_STAGING }}" \
              -e DB_PORT="${{ secrets.DB_PORT_STAGING }}" \
              -e DB_USER="${{ secrets.DB_USER_STAGING }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD_STAGING }}" \
              -e DB_NAME="${{ secrets.DB_NAME_STAGING }}" \
              $IMAGE_URI npx prisma migrate deploy
            echo "✅ Database migrations completed"

            # Set all required environment variables for docker-compose
            export NODE_ENV=production
            export DATABASE_URL="${{ secrets.DATABASE_URL_STAGING }}"
            export DB_HOST="${{ secrets.DB_HOST_STAGING }}"
            export DB_PORT="${{ secrets.DB_PORT_STAGING }}"
            export DB_USER="${{ secrets.DB_USER_STAGING }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD_STAGING }}"
            export DB_NAME="${{ secrets.DB_NAME_STAGING }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}"
            export JWT_ACCESS_EXPIRES_IN="${{ secrets.JWT_ACCESS_EXPIRES_IN }}"
            export JWT_REFRESH_EXPIRES_IN="${{ secrets.JWT_REFRESH_EXPIRES_IN }}"
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            export GOOGLE_CALLBACK_URL="${{ secrets.GOOGLE_CALLBACK_URL }}"
            export GMAIL_CLIENT_ID="${{ secrets.GMAIL_CLIENT_ID }}"
            export GMAIL_CLIENT_SECRET="${{ secrets.GMAIL_CLIENT_SECRET }}"
            export GMAIL_REDIRECT_URI="${{ secrets.GMAIL_REDIRECT_URI }}"
            export GMAIL_REFRESH_TOKEN="${{ secrets.GMAIL_REFRESH_TOKEN }}"
            export GMAIL_USER="${{ secrets.GMAIL_USER }}"
            export GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}"
            export FRONTEND_URL="${{ secrets.FRONTEND_URL_STAGING }}"
            export AWS_REGION=us-east-1
            export ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}"
            export SWAGGER_USER="${{ secrets.SWAGGER_USER }}"
            export SWAGGER_PASSWORD="${{ secrets.SWAGGER_PASSWORD }}"
            export LOKI_HOST="${{ secrets.LOKI_HOST_STAGING }}"

            # Cleanup Docker: remove stopped containers, unused images, and unused volumes (forced, no prompt)
            echo "🧹 Cleaning up Docker: removing stopped containers, unused images, and unused volumes..."
            docker container prune -f
            docker image prune -af
            docker volume prune -f

            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            docker-compose -f docker-compose.ec2.yml down || true

            # Pull latest image
            echo "📥 Pulling latest image..."
            docker pull $IMAGE_URI

            # # Run tenant schema migrations
            # echo "🔄 Running tenant schema migrations..."
            # chmod +x ./accurack/update-tenant-schemas.sh
            # ./accurack/update-tenant-schemas.sh
            # echo "✅ Tenant schema migrations completed"

            # Start new containers
            echo "🚀 Starting new containers..."
            docker-compose -f docker-compose.ec2.yml up -d

            # Check container status
            echo "📋 Container status:"
            docker-compose -f docker-compose.ec2.yml ps

            # Show logs for verification
            echo "📝 Recent logs:"
            docker-compose -f docker-compose.ec2.yml logs --tail=20

            echo "✅ Deployment completed successfully!"
